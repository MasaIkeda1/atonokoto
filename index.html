<style>
/* VOICE  work: a pitch demo for funeral homes, banks and insurers; calm, exact, in the slides' own colours
   IDEA   a presenter's stage: the family's phone on the left, what the company does behind it on the right
   PICTURE the phone screen itself, the working product, one scene per click

   LAYOUT laptop: band on top, phone left, notes right, controls below; narrow: the screen fills, notes fold below */
:root{color-scheme:light;--navy:#02253C;--blue:#355163;--mid:#5B707E;--gray:#CCD3D8;--lg:#9AA8B1;--bg:#FCFCFB;--white:#FFFFFE;--org:#B45309;--tint:#E8ECEF;--line:#DDE2E6;--ai:#DCE5EC;--orgt:#F9F0E8}

button,input{font:inherit;color:inherit}
p,ul,ol,dl,dd,h2{margin:0}

/* 上の帯 */

.steps li+li::before{content:"";position:absolute;left:-21px;top:50%;width:16px;height:2px;background:var(--blue)}

.s-done{background:var(--navy);color:var(--white)}

/* 場面4 */
.sum{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--navy);color:var(--white)}
.sum .big{font-size:34px;font-weight:700;line-height:1}
.sum .big small{font-size:16px;margin-left:2px}
.sum p{font-size:14px;line-height:1.4}
.sum ul{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:15px}
.sum ul b{font-size:20px;margin:0 1px 0 4px}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin:12px 0 0;border-bottom:2px solid var(--navy)}
.tabs button{min-height:52px;padding:4px 2px;border:1px solid var(--gray);border-bottom:0;border-radius:6px 6px 0 0;background:var(--tint);color:var(--blue);font-size:14px;font-weight:700;line-height:1.3;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--navy);border-color:var(--navy);color:var(--white)}
.tabs button span{display:block;font-weight:500}
.tnote{margin:10px 0 2px;padding:8px 10px;border-radius:6px;background:var(--tint);font-size:14px;line-height:1.5;color:var(--blue)}
.cmp{margin:12px 0 6px;padding:10px 12px;border:1.5px solid var(--navy);border-radius:8px}
.cmp .cap{font-size:14px;color:var(--mid)}
.cmp .sen{font-size:15px;font-weight:700;line-height:1.5;margin:4px 0 0}
.cmp .sen b{font-size:26px;margin:0 2px;vertical-align:-2px}
.cells{display:grid;grid-template-columns:repeat(19,minmax(0,1fr));gap:3px;margin:8px 0}
.cells i{aspect-ratio:1;border-radius:2px;background:var(--gray)}
.cells i.on{background:var(--navy)}
.more{min-height:44px;width:100%;margin:2px 0 0;border:1px solid var(--gray);border-radius:6px;background:var(--white);color:var(--blue);font-size:14px;font-weight:700;cursor:pointer}
.grey{margin:8px 0 0;padding:8px 10px;border-radius:6px;background:var(--tint);color:var(--mid);font-size:14px;line-height:1.6}
.grey li{display:inline}
.grey li+li::before{content:"、"}
.grp{margin:14px 0 2px;font-size:14px;font-weight:700;color:var(--mid)}
.its li.it{border-bottom:1px solid var(--line)}
.ith{display:grid;grid-template-columns:minmax(0,1fr) auto 16px;gap:8px;align-items:center;width:100%;min-height:52px;padding:8px 0;border:0;background:none;text-align:left;cursor:pointer}
.ith .nm b{display:block;font-size:15px;line-height:1.4}
.ith .nm small{display:block;font-size:14px;line-height:1.4;color:var(--mid)}
.ith .tags{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.pm{position:relative;width:14px;height:14px}
.pm::before,.pm::after{content:"";position:absolute;left:0;top:6px;width:14px;height:2px;background:var(--blue)}
.pm::after{transform:rotate(90deg)}
.it.open .pm::after{display:none}
.itd{display:none;margin:0 0 10px;padding:10px 12px;border-radius:8px;background:var(--tint)}
.it.open .itd{display:grid;grid-template-columns:6.4em minmax(0,1fr);gap:4px 10px}
.itd dt{font-size:14px;font-weight:700;color:var(--mid)}
.itd dd{font-size:14px;line-height:1.5}
.visit{margin:14px 0 0;padding:12px 14px;border-radius:8px;border:1px solid var(--blue)}
.visit li{position:relative;padding-left:14px;margin:6px 0;font-size:14px;line-height:1.55}
.visit li::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--navy)}
.visit li:first-child{font-size:15px;font-weight:700}

/* 場面5 */
.bds{margin:0 0 12px;border:1px solid var(--gray);border-radius:8px;overflow:hidden}
.bd{padding:9px 12px;border-top:1px solid var(--line)}
.bd:first-child{border-top:0}
.bd .h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.bd .h b{display:block;line-height:1.4}
.bd .h small{display:block;font-size:14px;color:var(--mid);line-height:1.4}
.bd.open{background:var(--tint)}
.paper{margin:10px 0 4px;padding:12px;border:1px solid var(--lg);border-radius:6px;background:var(--white);box-shadow:0 1px 2px rgba(2,37,60,.08)}
.pt{text-align:center;font-size:17px;font-weight:700;letter-spacing:.25em}
.pto{font-size:14px;color:var(--mid);text-align:center;margin:0 0 8px}
.pf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.pf .k{grid-column:1/-1;font-size:14px;color:var(--mid)}
.pf .v{padding:3px 8px;border-radius:4px;background:var(--ai);font-weight:700;line-height:1.45}
.pf .v.blank{background:none;border:1px dashed var(--lg);font-weight:500;color:var(--mid)}
.pf .fr2{font-size:14px;color:var(--mid);white-space:nowrap}
.legend{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mid);margin:8px 0 0}
.legend i{width:16px;height:12px;border-radius:3px;background:var(--ai)}
.att li{position:relative;padding-left:14px;margin:3px 0}
.att li::before{content:"";position:absolute;left:2px;top:.66em;width:5px;height:5px;border-radius:50%;background:var(--navy)}
.same{margin:6px 0 0;padding:6px 10px;border-radius:6px;background:var(--tint);font-size:14px;font-weight:700}
.cbx{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 12px;border:1.5px solid var(--navy);border-radius:8px;font-weight:700;cursor:pointer}
.cbx input{flex:none;width:20px;height:20px;margin:0;accent-color:var(--navy)}
.done-msg{display:none;margin:8px 0 0}
.done-msg.show{display:flex}

/* 場面6 */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.chips span{padding:4px 10px;border-radius:6px;background:var(--navy);color:var(--white);font-size:14px;font-weight:700}
.flow3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0}
.flow3 li{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border:1px solid var(--gray);border-radius:8px;text-align:center;font-size:14px;line-height:1.4}
.flow3 svg{width:56px;height:44px}
.flow3 .k{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--navy);color:var(--white);font-size:14px;font-weight:700}
.list12{font-size:14px;line-height:1.6;color:var(--blue);margin:4px 0 0}

/* 場面7 */
.bar7{display:flex;height:14px;margin:10px 0 8px;border-radius:4px;overflow:hidden;background:var(--white);border:1px solid var(--gray)}
.bar7 i{display:block;height:100%}
.g-done{background:var(--navy)}
.g-doing{background:var(--blue)}
.g-wait{background:var(--lg)}
.g-todo{background:var(--gray)}
.g-ask{background:var(--white);box-shadow:inset 0 0 0 2px var(--navy)}
.lg7{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px;font-size:14px}
.lg7 li{display:flex;align-items:center;gap:6px}
.lg7 .sw{flex:none;width:12px;height:12px;border-radius:3px}
.lg7 b{font-size:16px;margin-left:auto}
.ask{margin:12px 0;padding:10px 12px;border:2px solid var(--navy);border-radius:8px}
.ask p{font-size:14px;line-height:1.5}
.dl7{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 4px;font-size:14px;color:var(--mid)}
.dl7 .pd{margin:0}
.pr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.pr .nm b{font-size:15px;line-height:1.35}
.pr .nm small{font-size:14px;color:var(--mid);margin-left:6px}
.pr .lg{grid-column:1/-1;font-size:14px;line-height:1.45;color:var(--blue)}
.pr .rt{display:flex;align-items:center;gap:8px}
.pd{display:flex;gap:4px;align-items:center}
.pd i{display:block;width:11px;height:11px;border-radius:50%;border:2px solid var(--lg);background:var(--white)}
.pd i.on{border-color:var(--navy);background:var(--navy)}
.c-done{background:var(--navy);color:var(--white)}
.c-doing{background:var(--blue);color:var(--white)}
.c-wait{background:var(--white);color:var(--blue);border:1px solid var(--blue)}
.c-todo{background:var(--tint);color:var(--navy)}
.c-ask{background:var(--white);color:var(--navy);border:2px solid var(--navy);font-weight:700}
.ddl{margin:14px 0 0}
.ddl li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.45}
.ddl li b{font-size:15px}
.ddl .rm{grid-column:2;grid-row:1/span 2;align-self:center;font-weight:700;white-space:nowrap}
.hand{margin:14px 0 0;padding:12px 14px;border:1.5px solid var(--blue);border-radius:8px}
.hand p{font-size:14px;line-height:1.55}
.ntc{margin:12px 0 0;padding:8px 12px;border-radius:6px;background:var(--tint);font-size:14px;line-height:1.5}
.ntc b{display:block;font-size:14px;color:var(--mid);font-weight:500}
.fin{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:14px 0 0}
.fin>div{padding:10px 12px;border-radius:8px}
.fin .self{border:1px solid var(--gray);color:var(--blue)}
.fin .ours{background:var(--navy);color:var(--white)}
.fin p{font-size:14px;line-height:1.55}
.fin .st{font-size:14px}
.fin ul{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 4px;margin-top:4px}
.fin li{font-size:14px;line-height:1.25}
.fin li b{display:block;font-size:24px}
.fin li b small{font-size:14px;margin-left:1px}

@media (prefers-reduced-motion:reduce){
  #scr.fade{animation:none}
  .th,.res,.r,.nf,.iq .rs{transition:none}
}

/* 幅が狭い画面：スマホの画面を全面に、解説は下に畳む */
@media (max-width:899px){
  #app{height:100dvh}
  .top{flex-wrap:wrap;gap:8px 12px;padding:8px 12px}
  .logo{font-size:16px}
  .steps{order:3;width:100%;margin:0;justify-content:space-between}
  .steps li{padding:3px 6px 3px 3px;font-size:14px}
  .steps li:not(.now) .lb{display:none}
  .steps li+li{margin-left:10px}
  .steps li+li::before{left:-9px;width:8px}
  .demo{margin-left:auto;font-size:13px;padding:2px 8px}
  .stage{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:0;padding:0;align-items:stretch}
  .phone{align-self:stretch;width:auto;height:auto;max-height:none;min-height:0;padding:0;border-radius:0;background:none;box-shadow:none}
  .screen{border-radius:0;grid-template-rows:auto minmax(0,1fr)}
  .sbar{display:none}
  .notes{align-self:stretch;max-width:none;padding:0 16px;background:var(--white);border-top:1px solid var(--gray)}
  .ntog{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;padding:0;border:0;background:none;color:var(--navy);font-size:16px;font-weight:700;cursor:pointer}
  .ntog i{position:relative;width:14px;height:14px}
  .ntog i::before,.ntog i::after{content:"";position:absolute;left:0;top:6px;width:14px;height:2px;background:var(--navy)}
  .ntog i::after{transform:rotate(90deg)}
  .notes.open .ntog i::after{display:none}
  .nb{display:none}
  .notes.open .nb{display:block;max-height:44vh;overflow-y:auto;padding:0 0 14px}
  .scn{margin:4px 0 10px}
  .say{font-size:24px;margin:0 0 16px}
  .flow{grid-template-columns:minmax(0,1fr)}
  .ctrl{gap:4px;padding:6px 8px}
  .hint,#auto{display:none}
  .b{padding:0 12px}
  .b.p{min-width:88px}
  .dot{width:22px}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo"><svg viewBox="0 0 26 26" aria-hidden="true"><rect x="5" y="3" width="16" height="20" rx="3" fill="none" stroke="#FFFFFE" stroke-width="1.6"/><path d="M9 9h8M9 13h8M9 17h5" stroke="#9AA8B1" stroke-width="1.6" stroke-linecap="round"/></svg><span id="svc">あとのこと</span></div>
    <ol class="steps" id="steps" aria-label="手続きの進み具合"></ol>
    <p class="demo">デモ画面（架空のデータ）</p>
  </header>
  <main class="stage">
    <div class="phone" aria-label="遺族が見る画面">
      <div class="screen">
        <div class="sbar"><span class="num" id="clock"></span><span class="bat" aria-hidden="true"></span></div>
        <div class="abar"><div class="logo"><svg viewBox="0 0 26 26" aria-hidden="true"><rect x="5" y="3" width="16" height="20" rx="3" fill="none" stroke="#02253C" stroke-width="1.6"/><path d="M9 9h8M9 13h8M9 17h5" stroke="#355163" stroke-width="1.6" stroke-linecap="round"/></svg><span id="svc2">あとのこと</span></div><span class="who" id="who"></span></div>
        <div id="scr" tabindex="-1"></div>
      </div>
    </div>
    <section class="notes" id="notes" aria-live="polite">
      <button class="ntog" id="ntog" aria-expanded="false" aria-controls="nb">この場面の解説<i></i></button>
      <div class="nb" id="nb"></div>
    </section>
  </main>
  <footer class="ctrl">
    <div class="pbar" id="pbar"></div>
    <button class="b t" id="home">最初から</button>
    <button class="b" id="prev">戻る</button>
    <div class="dots" id="dots"></div>
    <span class="hint">左右の矢印キーでも動きます</span>
    <button class="b p" id="next">次へ</button>
    <button class="b" id="auto" aria-pressed="false">60秒で通す</button>
  </footer>
</div>

<script>
{
  const D = DATA, T = TEXT;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const scr = $('#scr'), nb = $('#nb'), notesEl = $('#notes'), app = $('#app');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const items = D.items;
  const N = T.scenes.length;
  const TABS = [ { id: 'money', name: 'お金と財産' }, { id: 'life', name: '暮らしの契約' }, { id: 'office', name: '役所と年金' } ];
  const PROG = [ ['完了', 'done'], ['進行中', 'doing'], ['通知待ち', 'wait'], ['これから', 'todo'], ['確認のお願い', 'ask'] ];
  const progKey = p => (PROG.find(x => x[0] === p) || ['', 'todo'])[1];
  const byTab = id => items.filter(x => x.tab === id);
  const newCount = items.filter(x => x.found === '新たに発見').length;
  const kuItems = items.filter(x => x.place === '区役所');
  const cancels = items.filter(x => x.cancel);

  let cur = 0, epoch = 0, timers = [], autoTimers = [], autoOn = false;
  const st = { tab: 'office', open: new Set([22]), more: false, conf: false, agree: false, asked: false };

  const later = (fn, ms) => { const e = epoch; timers.push(setTimeout(() => { if (e === epoch) fn(); }, ms)); };
  const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
  const logo = (a, b) => '<svg viewBox="0 0 26 26" aria-hidden="true"><rect x="5" y="3" width="16" height="20" rx="3" fill="none" stroke="' + a + '" stroke-width="1.6"/><path d="M9 9h8M9 13h8M9 17h5" stroke="' + b + '" stroke-width="1.6" stroke-linecap="round"/></svg>';

  function topIn(el) { let y = 0, n = el; while (n && n !== scr) { y += n.offsetTop; n = n.offsetParent; } return n === scr ? y : null; }
  function scrollToY(y) { scr.scrollTo({ top: Math.max(0, y), behavior: reduce ? 'auto' : 'smooth' }); }
  function follow(el) {
    const y = topIn(el); if (y === null) return;
    const h = scr.clientHeight;
    if (y < scr.scrollTop + 6 || y + el.offsetHeight > scr.scrollTop + h - 12) scrollToY(y - Math.round(h * 0.3));
  }

  const foundTag = x => '<span class="tag ' + (x.found === '新たに発見' ? 't-new' : x.found === '確認中' ? 't-chk' : 't-ok') + '">' + x.found + '</span>' + (x.foundNote ? '<span class="tag t-chk">' + x.foundNote + '</span>' : '');
  const progChip = p => '<span class="tag c-' + progKey(p) + '">' + p + '</span>';
  const dotsOf = (n, p) => '<span class="pd" role="img" aria-label="' + p + '"><i' + (n > 0 ? ' class="on"' : '') + '></i><i' + (n > 1 ? ' class="on"' : '') + '></i><i' + (n > 2 ? ' class="on"' : '') + '></i></span>';
  const daysTo = iso => Math.round((Date.parse(iso + 'T00:00:00Z') - Date.parse(D.today + 'T00:00:00Z')) / 86400000);

  function detail(x) {
    const docs = x.docs || (x.cancel ? '解約の申し込み、死亡の分かる書類の写し' : '');
    const next = x.next || (x.cancel ? '解約の申し込みに同意します' : x.corner ? '区役所へ行く日に、おくやみコーナーで出します' : '');
    const who = x.who || (x.cancel ? '当社が申し込みを取り次ぎます。ご本人は同意するだけです' : x.place === '区役所' ? D.heirs[0].short + 'さんが区役所の窓口で出します（' + D.officeDay + '）' : '');
    const rows = [['根拠', x.src], ['必要な書類', docs], ['次にやること', next], ['誰がやるか', who]];
    if (x.limit) rows.push(['期限', x.limit]);
    if (x.desk) rows.push(['窓口', x.desk + (x.corner ? '。2階のおくやみコーナーでまとめて出せます' : '')]);
    return '<dl class="itd">' + rows.filter(r => r[1]).map(r => '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>').join('') + '</dl>';
  }
  function itemRow(x) {
    const sub = x.tab === 'office' ? x.place : x.what;
    return '<li class="it' + (st.open.has(x.no) ? ' open' : '') + '" data-no="' + x.no + '"><button class="ith" aria-expanded="' + st.open.has(x.no) + '"><span class="nm"><b>' + x.name + '</b><small>' + sub + '</small></span><span class="tags">' + foundTag(x) + '</span><span class="pm" aria-hidden="true"></span></button>' + detail(x) + '</li>';
  }

  /* ---------- 場面ごとの画面 ---------- */
  const S = [];

  S[0] = { html: () =>
    '<p class="ad">' + D.funeral + 'からのご案内（広告）</p>' +
    '<p class="hero">葬儀の後の手続きを、写真・確認・署名だけに</p>' +
    '<ol class="three">' + ['写真を送る', '内容を確認する', '署名する'].map((t, i) => '<li><span class="k">' + (i + 1) + '</span>' + t + '</li>').join('') + '</ol>' +
    '<div class="sec"><p class="st">任せられること</p><ul class="ticks">' + D.promises.map(t => '<li>' + t + '</li>').join('') + '</ul></div>' +
    '<div class="price"><p class="st" style="margin:0">料金</p><p class="pv num">' + D.price + '</p><p class="small">' + D.priceNote + '</p></div>' +
    '<button class="btn-p" data-next>申し込む</button>' };

  S[1] = { html: () => {
    const d = D.deceased, a = D.applicant;
    return '<h2>お申し込み</h2><p class="lead">分かる範囲で大丈夫です。</p>' +
      '<div class="sec"><p class="st">亡くなった方</p>' +
      '<div class="fl"><span>お名前</span><b>' + d.name + 'さん</b></div>' +
      '<div class="fl2"><div class="fl"><span>年齢</span><b>' + d.age + '歳</b></div><div class="fl"><span>お住まい</span><b>' + d.city + '</b></div></div>' +
      '<div class="fl" style="margin:0"><span>亡くなった日</span><b>' + d.died + '</b></div></div>' +
      '<div class="sec"><p class="st">申し込む方</p><div class="fl" style="margin:0"><span>お名前</span><b>' + a.name + 'さん（' + a.rel + '）</b></div>' +
      '<p class="ok"><i class="ck"></i>本人確認は済みました</p></div>' +
      '<div class="sec"><p class="st" style="margin:0">相続人</p><ul class="ppl">' + D.heirs.map(h => '<li>' + h.name + 'さん（' + h.rel + '）</li>').join('') + '</ul></div>' +
      '<div class="sec"><p class="st" style="margin:0">ご存じのものにチェック</p><p class="small" style="margin:0">分からなくて大丈夫です</p>' +
      '<div class="cks">' + D.known.map((k, i) => '<label class="cb"><input type="checkbox" id="kn' + i + '" checked><span>' + k + '</span></label>').join('') + '</div></div>' +
      '<button class="btn-p" data-next>次へ</button>';
  } };

  let fillTok = 0;
  function fillPhotos() {
    const tok = ++fillTok, e = epoch;
    const ths = $$('.th', scr), counts = [0, 0, 0, 0];
    ths.forEach(t => t.classList.remove('in'));
    $$('.fr', scr).forEach(f => f.classList.remove('has'));
    $$('[data-c]', scr).forEach(c => { c.textContent = '0'; });
    const use = $('#use'); if (use) { use.classList.add('pressed'); use.setAttribute('aria-pressed', 'true'); }

    go(0, true);
    let t = 0;
    secs.forEach((d, i) => { t += d; autoTimers.push(setTimeout(() => { if (i < secs.length - 1) go(i + 1, true); else stopAuto(); }, t * 1000)); });
  }
  function stopAuto() {
    autoTimers.forEach(clearTimeout); autoTimers = [];
    autoOn = false;
    autoBtn.textContent = '60秒で通す'; autoBtn.setAttribute('aria-pressed', 'false');
    pbar.style.transition = 'none'; pbar.style.width = '0';
  }

  $('#next').addEventListener('click', next);
  $('#prev').addEventListener('click', prev);
  $('#home').addEventListener('click', home);
  autoBtn.addEventListener('click', () => (autoOn ? stopAuto() : startAuto()));
  $('#dots').addEventListener('click', e => { const d = e.target.closest('.dot'); if (d) go(+d.dataset.i); });
  $('#ntog').addEventListener('click', () => { const o = notesEl.classList.toggle('open'); $('#ntog').setAttribute('aria-expanded', o); });

  scr.addEventListener('click', e => {
    const t = e.target;
    if (t.closest('[data-next]')) { if (!t.closest('[data-next]').disabled) next(); return; }
    if (t.closest('#use')) { fillPhotos(); return; }
    if (t.closest('#replay')) { epoch++; clearTimers(); play3(); return; }
    const tab = t.closest('[data-tab]');
    if (tab) { st.tab = tab.dataset.tab; $$('.tabs button', scr).forEach(b => b.setAttribute('aria-selected', b === tab)); $('#lst').innerHTML = list4(); return; }
    const ith = t.closest('.ith');
    if (ith) {
      const li = ith.closest('.it'), no = +li.dataset.no;
      if (st.open.has(no)) st.open.delete(no); else st.open.add(no);
      li.classList.toggle('open', st.open.has(no)); ith.setAttribute('aria-expanded', st.open.has(no));
      return;
    }
    if (t.closest('.more')) { st.more = !st.more; $('#lst').innerHTML = list4(); return; }
    if (t.closest('#cfbtn')) { confirm5(); return; }
    if (t.closest('#agree')) { agree6(); return; }
    if (t.closest('#handbtn')) { st.asked = true; t.closest('#handbtn').textContent = '相談を受け付けました'; return; }
  });
  scr.addEventListener('change', e => { if (e.target.id === 'cf' && !e.target.checked && st.conf) e.target.checked = true; });

  document.addEventListener('keydown', e => {
    const f = e.target.closest && e.target.closest('input,textarea,select');
    if (f && f.type !== 'checkbox') return;
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
    else if (e.key === 'Home') { e.preventDefault(); home(); }
    else if (e.key === '+' || e.key === '=' || e.key === ';') { e.preventDefault(); userScale = Math.min(1.4, userScale + 0.1); fitPhone(); }
    else if (e.key === '-') { e.preventDefault(); userScale = Math.max(0.7, userScale - 0.1); fitPhone(); }
    else if (e.key === '0') { e.preventDefault(); userScale = 1; fitPhone(); }
  });

  const canZoom = window.CSS && CSS.supports && CSS.supports('zoom', '2');
  const stageEl = $('.stage'), phoneEl = $('.phone');
  /* スマホの枠の大きさ：画面の高さいっぱいに広げ、中の文字を大きく見せる。
     PHONE.minLines は枠の中に見せる最低の高さ（小さくすると文字が大きくなる）、
     maxShare は横幅のうちスマホが使ってよい割合。発表中は ＋ と － のキーでも変えられる */
  const PHONE = { minLines: 440, maxShare: 0.5, keyMax: 0.62, frameW: 412 };
  let userScale = 1;
  function fitPhone() {
    if (window.innerWidth < 900 || !canZoom) { phoneEl.style.zoom = ''; phoneEl.style.height = ''; return; }
    const cs = getComputedStyle(stageEl);
    const H = stageEl.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const W = Math.min(stageEl.clientWidth, 1240) - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const base = Math.min(H / PHONE.minLines, (W * PHONE.maxShare) / PHONE.frameW);
    const s = Math.max(1, Math.min(base * userScale, (W * PHONE.keyMax) / PHONE.frameW, 1.9));
    phoneEl.style.zoom = String(s);
    phoneEl.style.height = (H / s) + 'px';
  }
  function fit() {
    const w = window.innerWidth, h = window.innerHeight;
    if (w >= 900) {
      const z = canZoom ? Math.max(1, Math.min(w / 1280, h / 720, 1.6)) : 1;
      app.style.zoom = z === 1 ? '' : String(z);
      app.style.width = (w / z) + 'px';
      app.style.height = Math.max(h / z, 520) + 'px';
      document.body.style.overflow = h / z < 520 ? 'auto' : 'hidden';
    } else {
      app.style.zoom = ''; app.style.width = ''; app.style.height = '';
      document.body.style.overflow = 'hidden';
    }
    fitPhone();
  }
  window.addEventListener('resize', fit);
  fit();
  render();
  window.demo = { go: i => go(i), next, prev, home, get cur() { return cur; } };
}
</script>
</body>
